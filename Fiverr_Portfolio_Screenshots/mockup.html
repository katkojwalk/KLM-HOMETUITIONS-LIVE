
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <style>
        body {
          margin: 0;
          padding: 0;
          width: 1024px;
          height: 768px;
          background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
          display: flex;
          justify-content: center;
          align-items: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          position: relative;
          overflow: hidden;
        }

        /* Decorative background elements */
        .circle-1 {
          position: absolute;
          width: 600px;
          height: 600px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.05);
          top: -200px;
          right: -100px;
        }
        .circle-2 {
          position: absolute;
          width: 400px;
          height: 400px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.03);
          bottom: -100px;
          left: -150px;
        }

        .title {
          position: absolute;
          top: 40px;
          left: 50px;
          color: white;
        }
        .title h1 {
          margin: 0;
          font-size: 32px;
          font-weight: 700;
          letter-spacing: 1px;
        }
        .title p {
          margin: 5px 0 0 0;
          font-size: 16px;
          color: rgba(255, 255, 255, 0.8);
        }

        .mockup-container {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 30px;
          margin-top: 50px;
          z-index: 10;
        }

        /* Laptop Mockup */
        .laptop-container {
          position: relative;
          width: 600px;
          height: 380px;
        }
        .laptop-screen {
          width: 500px;
          height: 312px;
          background: #000;
          border-radius: 8px 8px 0 0;
          margin: 0 auto;
          position: relative;
          border: 12px solid #333;
          border-bottom: 20px solid #222;
          box-shadow: 0 20px 40px rgba(0,0,0,0.4);
          overflow: hidden;
        }
        .laptop-screen img {
          width: 100%;
          height: auto;
          display: block;
        }
        .laptop-base {
          width: 600px;
          height: 15px;
          background: #cfcfcf;
          border-radius: 0 0 15px 15px;
          position: absolute;
          bottom: 40px;
          left: 0;
          box-shadow: inset 0 -3px 5px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.3);
        }
        .laptop-base::before {
          content: '';
          position: absolute;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 100px;
          height: 4px;
          background: #a0a0a0;
          border-radius: 0 0 4px 4px;
        }

        /* Phone Mockup */
        .phone-container {
          position: relative;
          width: 180px;
          height: 360px;
          background: #111;
          border-radius: 30px;
          padding: 8px;
          box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 0 0 2px #444;
          z-index: 11;
          margin-top: 30px;
        }
        .phone-notch {
          position: absolute;
          top: 8px;
          left: 50%;
          transform: translateX(-50%);
          width: 80px;
          height: 20px;
          background: #111;
          border-radius: 0 0 12px 12px;
          z-index: 20;
        }
        .phone-screen {
          width: 100%;
          height: 100%;
          background: #fff;
          border-radius: 22px;
          overflow: hidden;
          position: relative;
        }
        .phone-screen img {
          width: 100%;
          height: auto;
          display: block;
        }

        .badge {
          position: absolute;
          bottom: 40px;
          right: 50px;
          background: rgba(255,255,255,0.1);
          border: 1px solid rgba(255,255,255,0.2);
          backdrop-filter: blur(10px);
          padding: 10px 20px;
          border-radius: 30px;
          color: white;
          font-weight: 600;
          font-size: 14px;
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .badge span {
          width: 10px;
          height: 10px;
          background: #4ade80;
          border-radius: 50%;
          display: inline-block;
          box-shadow: 0 0 10px #4ade80;
        }
      </style>
    </head>
