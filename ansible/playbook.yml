---
- name: Configure Quadra Home Tuitions AWS Server
  hosts: all
  become: true

  vars:
    app_dir: /home/ec2-user/quadra-hometuitions

  tasks:

    - name: Update Amazon Linux packages
      dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Install Git
      dnf:
        name: git
        state: present

    - name: Install Nginx
      dnf:
        name: nginx
        state: present

    - name: Install Node.js and npm
      shell: |
        curl -fsSL https://rpm.nodesource.com/setup_18.x | bash -
        dnf install -y nodejs
      args:
        executable: /bin/bash

    - name: Install PM2 globally
      npm:
        name: pm2
        global: true

    - name: Enable Nginx
      systemd:
        name: nginx
        enabled: true
        state: started

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Clone Quadra Home Tuitions repository
      become_user: ec2-user
      git:
        repo: "https://github.com/katkojwalk/quadra-hometuitions.git"
        dest: "{{ app_dir }}"
        version: main
        force: true

    - name: Install frontend dependencies
      become_user: ec2-user
      command: npm install --legacy-peer-deps
      args:
        chdir: "{{ app_dir }}/client"

    - name: Build React frontend
      become_user: ec2-user
      shell: NODE_OPTIONS="--max-old-space-size=768" npm run build
      args:
        chdir: "{{ app_dir }}/client"
      environment:
        NODE_OPTIONS: "--max-old-space-size=768"

    - name: Deploy React frontend
      copy:
        src: "{{ app_dir }}/client/build/"
        dest: /usr/share/nginx/html/
        remote_src: true
        owner: nginx
        group: nginx
        mode: "0755"

    - name: Install backend dependencies
      become_user: ec2-user
      command: npm install --legacy-peer-deps
      args:
        chdir: "{{ app_dir }}/server"

    - name: Start or restart backend with PM2
      become_user: ec2-user
      shell: |
        cd "{{ app_dir }}/server"
        pm2 start server.js --name quadra-backend || pm2 restart quadra-backend
        pm2 save
      args:
        executable: /bin/bash

    - name: Restart Nginx
      systemd:
        name: nginx
        state: restarted